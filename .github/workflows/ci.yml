name: CI

# Runs on every push and on every pull request targeting main — so a PR
# shows pass/fail status before it's merged, not after.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v

  e2e-tests:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Seed the database
        run: python -m app.seed_data

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # No manual server startup or wait-on step needed here — the
      # webServer config in playwright.config.ts starts both the
      # backend and frontend automatically before tests run, waits
      # until each responds, and tears them down after. This one
      # command is the full end-to-end run.
      - name: Run Playwright tests (auto-starts backend + frontend)
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: true
          # These two feed frontend/currents.config.ts, which uploads
          # this run's results to the Currents.dev dashboard alongside
          # the local HTML report. CURRENTS_PROJECT_ID is a repo
          # variable (not sensitive); CURRENTS_RECORD_KEY is a secret.
          CURRENTS_PROJECT_ID: ${{ vars.CURRENTS_PROJECT_ID }}
          CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # Runs even if tests failed (always()) so the public dashboard
      # still reflects a failing run rather than silently going stale.
      # Only builds data (doesn't publish) here — publishing happens in
      # the dedicated job below, gated to pushes on main only, so PR
      # branches never overwrite the live public dashboard.
      - name: Build dashboard data
        if: always()
        working-directory: frontend
        run: node scripts/build-dashboard.mjs

      - name: Upload dashboard site artifact
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-site
          path: docs/

  publish-dashboard:
    name: Publish test dashboard (GitHub Pages)
    needs: e2e-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download dashboard site artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-site
          path: docs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
