name: CI

# Runs on every push and on every pull request targeting main — so a PR
# shows pass/fail status before it's merged, not after.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v

  e2e-tests:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Seed the database
        run: python -m app.seed_data

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Both servers are started AND waited-on in this single step,
      # deliberately. GitHub Actions tears down each step's shell (and
      # anything backgrounded within it, even with nohup) once that step
      # finishes — so starting servers in one step and waiting for them in
      # a later step kills them before the wait ever runs. Keeping start
      # + wait in one continuous shell session avoids that.
      - name: Start servers and wait for them to be ready
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          (cd frontend && nohup npm run dev > ../frontend.log 2>&1 &)
          npx wait-on http-get://127.0.0.1:8000/health http://127.0.0.1:5173 --timeout 30000

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "--- backend.log ---"
          cat backend.log || true
          echo "--- frontend.log ---"
          cat frontend.log || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
